<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen quote demo for Renocare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#000000; --mute:#5B5F6B; --line:#E2E4EC;
  --blue:#0E4A28; --blue-soft:#E6F1EA; --on-blue:#FFFFFF; --btn:#0E4A28; --acc:#F55F09; --hd:#0A2D18; --ok:#137A45; --ok-soft:#E6F6EE;
  --bubble:#E9EAF0; --err:#C0262D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#14151B; --ink:#F4F5FA; --mute:#A2A6B4; --line:#2A2C36;
    --blue:#86D6A6; --blue-soft:#12301F; --on-blue:#FFFFFF; --btn:#2F8A55; --acc:#FF7A2E; --hd:#0F3A21; --ok:#5BD198; --ok-soft:#12301F;
    --bubble:#252731; --err:#FF7A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#14151B; --ink:#F4F5FA; --mute:#A2A6B4; --line:#2A2C36;
  --blue:#86D6A6; --blue-soft:#12301F; --on-blue:#FFFFFF; --btn:#2F8A55; --acc:#FF7A2E; --hd:#0F3A21; --ok:#5BD198; --ok-soft:#12301F;
  --bubble:#252731; --err:#FF7A80; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.demo-bar{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:8px 16px}
.demo-bar a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.mark{width:56px;height:56px;border-radius:50%;flex:0 0 56px;display:block}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:13px;color:var(--mute)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:6px;margin:8px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s ease}
h1{font-size:26px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.hint{color:var(--mute);font-size:14px;margin:0 0 18px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.group-label{font-weight:600;font-size:15px;margin:18px 0 8px}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;font-size:16px;cursor:pointer;background:var(--btn);color:var(--on-blue);margin-top:24px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.row-btns{display:flex;gap:10px;align-items:center;margin-top:24px}
.row-btns .btn{margin:0}
.back{background:none;border:0;color:var(--mute);padding:12px 6px;cursor:pointer;font-size:15px;flex:0 0 auto}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:10px 0;cursor:pointer;font-size:15px;display:block;margin:12px auto 0}

label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
input.t,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.err{color:var(--err);font-size:14px;margin-top:10px;min-height:1px}

.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop b{display:block;color:var(--blue)}
.drop span{font-size:14px;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.thumbs img,.thumbs .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph{background:var(--blue-soft)}

.intro-list{margin:18px 0 0;padding:0;list-style:none;font-size:15px;color:var(--mute)}
.intro-list li{padding:8px 0;border-top:1px solid var(--line)}
.intro-list li:first-child{border-top:0}

/* confirmation */
.tick{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:26px;margin-bottom:14px}
.sms-label{font-size:13px;color:var(--mute);margin:20px 0 6px}
.sms{background:var(--bubble);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:15px;max-width:92%}

/* team view */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.switch button{border:0;background:none;border-radius:10px;padding:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--mute)}
.switch button[aria-pressed="true"]{background:var(--btn);color:var(--on-blue)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card-hd{background:var(--hd);color:#fff;border-bottom:4px solid var(--acc);padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-hd small{font-size:12px;opacity:.65;display:block}
.card-hd b{font-size:19px;line-height:1.25;display:block}
.pill{white-space:nowrap;background:var(--acc);color:#1A0D02;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}
.dl{margin:0}
.dl div{display:flex;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);font-size:15px}
.dl dt{flex:0 0 120px;color:var(--mute)}
.dl dd{margin:0;font-weight:500}
.words{padding:14px 20px 18px;font-size:15px}
.words b{display:block;font-size:13px;color:var(--blue);margin-bottom:4px}
.card .thumbs{padding:0 20px 18px;margin:0}

.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 6px}
.stage{text-align:center;font-size:12px;color:var(--mute)}
.stage i{display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:6px;transition:background .3s}
.stage.done i{background:var(--acc)}
.stage.now{color:var(--ink);font-weight:600}
.next-box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-top:14px}
.next-box h3{font-size:16px;margin:0 0 4px}
.next-box p{margin:0;color:var(--mute);font-size:14px}
.next-box .sms{margin-top:12px}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:28px}
.foot a{color:var(--blue);font-weight:600;text-decoration:none}

.reveal{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.bar i,.stage i{transition:none}}
[hidden]{display:none!important}
</style>
</head>

  const chips=(list,key,multi)=>'<div class="chips" role="group">'+list.map(v=>{
    const on=multi?s[key].includes(v):s[key]===v;
    return `<button type="button" class="chip" aria-pressed="${on}" data-key="${key}" data-val="${esc(v)}" data-multi="${multi?1:0}">${esc(v)}</button>`;
  }).join('')+'</div>';
  const progress=()=>`<div class="prog"><span>Your kitchen</span><span>Step ${step} of ${TOTAL}</span></div><div class="bar"><i style="width:${step/TOTAL*100}%"></i></div>`;
  const nav=(ok,label)=>`<div class="row-btns"><button type="button" class="back" data-act="back">Back</button><button type="button" class="btn" data-act="next" ${ok?'':'disabled'}>${label||'Continue'}</button></div>`;
  const exPhoto=i=>{const w=['#E9E4DC','#DCE3EA','#E6E1D6','#D9DEE6','#E3DDD2'][i%5],c=['#8A6B4E','#6E7B8C','#9A7C5C','#5E6A7A','#7D6650'][i%5];
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${w}"/><rect x="8" y="12" width="84" height="22" fill="${c}"/><line x1="36" y1="12" x2="36" y2="34" stroke="${w}" stroke-width="1.5"/><line x1="64" y1="12" x2="64" y2="34" stroke="${w}" stroke-width="1.5"/><rect x="8" y="58" width="84" height="5" fill="#B9B3A8"/><rect x="8" y="63" width="84" height="29" fill="${c}"/><line x1="36" y1="63" x2="36" y2="92" stroke="${w}" stroke-width="1.5"/><line x1="64" y1="63" x2="64" y2="92" stroke="${w}" stroke-width="1.5"/><rect x="${20+i*9}" y="48" width="16" height="10" rx="2" fill="#C9C3B8"/></svg>`)};
  const thumbs=()=>s.photos.length?'<div class="thumbs">'+s.photos.map((p,i)=>p==='ex'?`<img src="${exPhoto(i)}" alt="Example kitchen photo">`:`<img src="${p}" alt="Kitchen photo">`).join('')+'</div>':'';

  function render(){
    let h='';
    if(view==='team'){renderTeam();return;}
    if(step===0){
      h=`<div class="panel reveal"><h1>Get a quote for your kitchen</h1>
        <p class="hint" style="margin:0">A few quick questions and some photos. It takes about 2 minutes and helps us give you a price faster.</p>
        <ul class="intro-list"><li>What you’d like done</li><li>Size, budget and timing</li><li>Photos of your kitchen</li></ul>
        <button type="button" class="btn" data-act="next">Start</button>
        <button type="button" class="link" data-act="example">Skip ahead with example answers</button></div>`;
    } else if(step===1){
      h=`<div class="panel">${progress()}<h2>What would you like done?</h2><p class="hint">Select all that apply</p>${chips(WORK,'work',1)}${nav(s.work.length)}</div>`;
    } else if(step===2){
      h=`<div class="panel">${progress()}<h2>Tell us about your kitchen</h2><p class="hint">A rough idea is fine</p>
        <div class="group-label">Shape</div>${chips(SHAPE,'shape',0)}<div class="group-label">Size</div>${chips(SIZE,'size',0)}${nav(s.shape&&s.size)}</div>`;
    } else if(step===3){
      h=`<div class="panel">${progress()}<h2>What’s your budget range?</h2><p class="hint">This helps us suggest the right options</p>${chips(BUDGET,'budget',0)}${nav(s.budget)}</div>`;
    } else if(step===4){
      h=`<div class="panel">${progress()}<h2>When would you like to start?</h2><p class="hint">Pick the closest one</p>${chips(TIMING,'timing',0)}${nav(s.timing)}</div>`;
    } else if(step===5){
      h=`<div class="panel">${progress()}<h2>Add photos of your kitchen</h2><p class="hint">A few wide shots help us quote without a visit</p>
        <label class="drop" for="ph"><b>Add photos</b><span>From your camera or gallery</span></label>
        <input id="ph" type="file" accept="image/*" multiple hidden>${thumbs()}
        ${nav(true,s.photos.length?'Continue':'Skip for now')}</div>`;
    } else if(step===6){
      h=`<div class="panel">${progress()}<h2>Anything else we should know?</h2><p class="hint">Style ideas, problems with the current kitchen, anything</p>
        <textarea id="notes" aria-label="Notes" placeholder="For example: doors are falling off, want white shaker cabinets">${esc(s.notes)}</textarea>${nav(true)}</div>`;
    } else if(step===7){
      h=`<div class="panel">${progress()}<h2>Where can we reach you?</h2><p class="hint">We’ll get back to you with next steps</p>
        <label class="f" for="nm">Name</label><input class="t" id="nm" autocomplete="name" value="${esc(s.name)}">
        <label class="f" for="pn">Phone</label><input class="t" id="pn" type="tel" autocomplete="tel" value="${esc(s.phone)}">
        <label class="f" for="ar">City or area</label><input class="t" id="ar" value="${esc(s.area)}">
        <div class="group-label">Best time to call</div>${chips(CALL,'call',0)}
        <div class="err" id="err" role="alert"></div>${nav(true,'Send my request')}</div>`;
    } else if(step===8){
      const first=esc((s.name||'there').split(' ')[0]);
      h=`<div class="panel reveal"><div class="tick" aria-hidden="true">✓</div><h1>Thanks, ${first}. We’ve got your request.</h1>
        <p class="hint" style="margin:0">Someone from Renocare will call you ${s.call?esc(s.call.toLowerCase()):'soon'}.</p>
        <div class="sms-label">The customer also gets this text right away</div>
        <div class="sms">Hi ${first}, thanks for your kitchen request with Renocare! We’ve got your details${s.photos.length?' and photos':''} and will be in touch ${s.call?esc(s.call.toLowerCase()):'soon'}.</div>
        <button type="button" class="btn" data-act="team">See what Renocare receives</button>
        <button type="button" class="link" data-act="restart">Start over</button></div>`;
    }
    app.innerHTML=h;
    const ph=document.getElementById('ph');
    if(ph) ph.addEventListener('change',e=>{
      const files=[...e.target.files].slice(0,8-s.photos.length);
      let left=files.length; if(!left) return;
      files.forEach(f=>{const r=new FileReader();r.onload=()=>{s.photos.push(r.result);if(--left===0)render();};r.readAsDataURL(f);});
    });
  }

  function renderTeam(){
    const names=['New','Quoted','Waiting','Booked'];
    const pill=['Reply today','Quote sent','Follow-up set','Site visit booked'][stage];
    const nextLabel=['Mark as quoted','No reply after 3 days','Customer booked a visit',''][stage];
    const first=esc((s.name||'there').split(' ')[0]);
    const nextBox=[
      `<h3>What happens next</h3><p>Call ${first} back, or send a ballpark from the photos. Once you send a quote, mark it as quoted.</p>`,
      `<h3>Quote sent</h3><p>If ${first} doesn’t reply in 3 days, a friendly check-in goes out on its own.</p>`,
      `<h3>Check-in sent automatically</h3><p>No one had to remember to chase it.</p><div class="sms">Hi ${first}, just checking you got our quote for the kitchen. Happy to answer any questions or come out for a look.</div>`,
      `<h3>Site visit booked</h3><p>From first enquiry to booked job, with the details and photos in one place the whole time.</p>`
    ][stage];
    app.innerHTML=`<div class="switch" role="group" aria-label="View"><button type="button" aria-pressed="false" data-act="customer">Customer</button><button type="button" aria-pressed="true">What you receive</button></div>
      <article class="card reveal"><div class="card-hd"><div><small>New kitchen enquiry</small><b>${esc(s.work.slice(0,2).map((w,i)=>i?w.toLowerCase():w).join(' and ')||'Kitchen')}${s.work.length>2?' and more':''}</b></div><span class="pill">${pill}</span></div>
      <dl class="dl">
        <div><dt>Customer</dt><dd>${esc(s.name||'Not given')}</dd></div>
        <div><dt>Phone</dt><dd>${esc(s.phone||'Not given')}</dd></div>
        <div><dt>Area</dt><dd>${esc(s.area||'Not given')}</dd></div>
        <div><dt>Work wanted</dt><dd>${esc(s.work.join(', '))}</dd></div>
        <div><dt>Kitchen</dt><dd>${esc(s.size)}, ${esc(s.shape)}</dd></div>
        <div><dt>Budget</dt><dd>${esc(s.budget)}</dd></div>
        <div><dt>Timing</dt><dd>${esc(s.timing)}</dd></div>
        <div><dt>Best time to call</dt><dd>${esc(s.call||'Any time')}</dd></div>
        <div><dt>Photos</dt><dd>${s.photos.length?s.photos.length+' added':'None yet'}</dd></div>
      </dl>
      ${s.notes?`<div class="words"><b>In their words</b>“${esc(s.notes)}”</div>`:''}
      ${thumbs()}</article>
      <div class="stages" aria-label="Job status">${names.map((n,i)=>`<div class="stage ${i<=stage?'done':''} ${i===stage?'now':''}"><i></i>${n}</div>`).join('')}</div>
      <div class="next-box">${nextBox}</div>
      ${nextLabel?`<button type="button" class="btn" data-act="advance">${nextLabel}</button>`:''}
      <button type="button" class="link" data-act="restart">Start over</button>`;
  }

  app.addEventListener('click',e=>{
    const c=e.target.closest('.chip');
    if(c){const k=c.dataset.key,v=c.dataset.val;
      if(c.dataset.multi==='1'){s[k]=s[k].includes(v)?s[k].filter(x=>x!==v):[...s[k],v];}else{s[k]=v;}
      saveFields();render();return;}
    const a=e.target.closest('[data-act]'); if(!a) return;
    const act=a.dataset.act;
    saveFields();
    if(act==='next'){
      if(step===7){
        const err=document.getElementById('err');
        if(!s.name.trim()){err.textContent='Add your name so we know who to ask for.';document.getElementById('nm').focus();return;}
        if(!s.phone.trim()){err.textContent='Add a phone number so we can call you back.';document.getElementById('pn').focus();return;}
      }
      step++;
    }
    else if(act==='back') step=Math.max(0,step-1);
    else if(act==='example'){example();step=8;}
    else if(act==='team'){view='team';stage=0;}
    else if(act==='customer'){view='customer';}
    else if(act==='advance'){stage=Math.min(3,stage+1);}
    else if(act==='restart'){reset();}
    render(); window.scrollTo({top:0});
    const h=app.querySelector('h1,h2'); if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
  });
  function saveFields(){
    const g=id=>document.getElementById(id);
    if(g('notes')) s.notes=g('notes').value;
    if(g('nm')) s.name=g('nm').value;
    if(g('pn')) s.phone=g('pn').value;
    if(g('ar')) s.area=g('ar').value;
  }
  reset(); render();
})();
</script>
</body>
</html>
